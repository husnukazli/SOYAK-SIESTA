services:
  - type: web
    name: soyaksiestatenis
    runtime: node
    plan: free
    buildCommand: npm install --include=dev --legacy-peer-deps && npm run build
    startCommand: node server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: soyaksiestatenis-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true

databases:
  - name: soyaksiestatenis-db
    plan: free
    databaseName: soyaksiestatenis
    user: kort_admin
