services:
  - type: web
    name: kort-rezervasyon
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: NODE_ENV=production node server.ts
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: kort-rezervasyon-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: ADMIN_PASSCODE
        sync: false

databases:
  - name: kort-rezervasyon-db
    plan: free
    databaseName: kort_rezervasyon
    user: kort_admin
